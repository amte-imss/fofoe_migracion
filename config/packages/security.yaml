security:
    password_hashers:
        App\Entity\Usuario:
            algorithm: bcrypt
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\Usuario
                property: matricula

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_dashboard
                username_parameter: _matricula
                password_parameter: _password
            logout:
                path: app_logout

    role_hierarchy:
        ROLE_SUPER: [ROLE_USER, ROLE_ADM_FOFOE, ROLE_POSGRADO, ROLE_CONVENIOS, ROLE_CAME,
                     ROLE_JDES, ROLE_FOFOE_INICIO, ROLE_FOFOE_VALIDAR_PAGO,
                     ROLE_FOFOE_VALIDAR_PAGO_MULTIPLE, ROLE_FOFOE_REGISTRAR_FACTURA,
                     ROLE_FOFOE_DETALLE_INSTITUCION_EDUCATIVA, ROLE_FOFOE_REPORTE_INGS,
                     ROLE_FOFOE_REPORTE_OP, ROLE_IE, ROLE_CONVENIOS_OBSERVER]
        ROLE_ADM_FOFOE: [ROLE_USER]
        ROLE_POSGRADO: [ROLE_USER]
        ROLE_CONVENIOS: [ROLE_USER]
        ROLE_CAME: [ROLE_USER]
        ROLE_CAME_MINUS: [ROLE_USER, ROLE_CAME]
        ROLE_JDES: [ROLE_USER]
        ROLE_JDES_MINUS: [ROLE_USER, ROLE_JDES]
        ROLE_FOFOE_INICIO: [ROLE_USER]
        ROLE_FOFOE_VALIDAR_PAGO: [ROLE_USER]
        ROLE_FOFOE_VALIDAR_PAGO_MULTIPLE: [ROLE_USER]
        ROLE_FOFOE_REGISTRAR_FACTURA: [ROLE_USER]
        ROLE_FOFOE_DETALLE_INSTITUCION_EDUCATIVA: [ROLE_USER]
        ROLE_FOFOE_REPORTE_INGS: [ROLE_USER]
        ROLE_FOFOE_REPORTE_OP: [ROLE_USER]
        ROLE_IE: [ROLE_USER]
        ROLE_CONVENIOS_OBSERVER: [ROLE_USER]
        ROLE_ALUMNO_POSGRADO: [ROLE_USER]

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/enfermeria-alumno, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
