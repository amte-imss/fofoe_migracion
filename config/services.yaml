# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# config/services.yaml
parameters:
    locale: es
    app.path.instituciones: /uploads/instituciones
    app.path.instituciones_name: instituciones
    app.path.residentes: /uploads/residentes
    app.path.residentes_name: residentes
    app.path.uploads: /uploads
    app.path.alumno_enfermeria: /uploads/alumno_enfermeria
    mailer_sender:                  'no_contestar@educacionensalud.imss.gob.mx'
    referencias_bancarias_dir:      '%kernel.project_dir%/var/referencias_bancarias'
    tmp_dir:                        '%kernel.project_dir%/var/tmp'
    zip_referencias_bancarias_dir:  '%kernel.project_dir%/var/Referenciasbancarias.zip'
    zip_formatos_fofoe_dir:         '%kernel.project_dir%/var/FormatosFOFOE.zip'
    formato_fofoe_dir:              '%kernel.project_dir%/var/formato_fofoe'
    credenciales_dir:               '%kernel.project_dir%/var/credenciales'
    private_dir:                    '%kernel.project_dir%/public/uploads'
    institucion_dir:                '%private_dir%/instituciones'
    alumno_enfermeria_dir:          '%private_dir%/alumno_enfermeria'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\EventListener\LogoutListener:
        tags:
            -   name: kernel.event_listener
                event: Symfony\Component\Security\Http\Event\LogoutEvent

    vich_uploader.download_handler:
        class: Vich\UploaderBundle\Handler\DownloadHandler
        public: true
        autowire: true
        autoconfigure: true

    app.user_checker:
        class: App\Security\UserCaptchaChecker

    App\Service\Posgrado\ResidenciaExNoImssManagerInterface:
        alias: App\Service\Posgrado\ResidenciaExNoImssManager

    App\Service\Posgrado\ResidenciaExNoImssManager:
        arguments:
            $mailerSender: '%mailer_sender%'

    App\Calculator\Posgrado\ResidenteExtranjeroNoImssCalculatorInterface:
        alias: App\Calculator\Posgrado\ResidenteExtranjeroNoImssCalculator

    App\Controller\Came\CampoClinicoController:
        arguments:
            $formatoFofoeDir: '%formato_fofoe_dir%'
            $credencialesDir: '%credenciales_dir%'

    App\Service\SIEDManager:
        arguments:
            $siedURL: '%sied_url%'

    App\Controller\IE\InstitucionController:
        arguments:
            $mailerSender: '%mailer_sender%'

    App\Controller\Fofoe\CampoClinicoController:
        arguments:
            $mailerSender: '%mailer_sender%'

    App\Controller\Fofoe\DocumentController:
        arguments:
            $formatoFofoeDir: '%formato_fofoe_dir%'

    App\Normalizer\CedulaIdentificacionNormalizer:
        autowire: false  # ← desactiva autowiring para este servicio
        arguments:
            $normalizer: '@serializer.normalizer.object'
            $institucionDir: '%institucion_dir%'
        tags: ['serializer.normalizer']

    App\Normalizer\FormatoFOFOENormalizer:
        autowire: false
        arguments:
            $normalizer: '@serializer.normalizer.object'
            $router: '@router'
        tags: ['serializer.normalizer']

    App\Normalizer\OficioMontosNormalizer:
        autowire: false
        arguments:
            $normalizer: '@serializer.normalizer.object'
            $institucionDocumentsDir: '%app.path.instituciones%'
            $tokenStorage: '@security.token_storage'
        tags: ['serializer.normalizer']

    App\Normalizer\ComprobantePagoNormalizer:
        autowire: false
        arguments:
            $normalizer: '@serializer.normalizer.object'
            $institucionDocumentsDir: '%app.path.instituciones%'
            $tokenStorage: '@security.token_storage'
        tags: ['serializer.normalizer']

    App\Normalizer\FacturaNormalizer:
        autowire: false
        arguments:
            $normalizer: '@serializer.normalizer.object'
            $institucionDocumentsDir: '%app.path.instituciones%'
            $tokenStorage: '@security.token_storage'
        tags: ['serializer.normalizer']

    App\Normalizer\MontoAPagarNormalizer:
        autowire: false
        arguments:
            $normalizer: '@serializer.normalizer.object'
            $calculator: '@App\Calculator\CampoClinicoCalculatorInterface'
        tags: ['serializer.normalizer']

    App\Calculator\CampoClinicoCalculatorInterface:
        alias: App\Calculator\CampoClinicoCalculator

    App\Service\SolicitudManagerInterface:
        alias: App\Service\SolicitudManager

    App\Service\SolicitudManager:
        arguments:
            $mailerSender: '%mailer_sender%'
            $calculator:   '@App\Calculator\CampoClinicoCalculatorInterface'


    #DetalleSolicitud
    App\Repository\IE\DetalleSolicitud\ListaCamposClinicos\CamposClinicos:
        alias: App\Repository\IE\DetalleSolicitud\ListaCamposClinicos\CamposClinicosUsingSql

    App\Repository\IE\DetalleSolicitud\ListaCamposClinicos\CamposClinicosUsingSql:
        arguments:
            $connection: '@database_connection'

    App\Repository\IE\DetalleSolicitud\TotalCamposClinicosAutorizados\TotalCamposClinicos:
        alias: App\Repository\IE\DetalleSolicitud\TotalCamposClinicosAutorizados\TotalCamposClinicosUsingSql

    App\Repository\IE\DetalleSolicitud\TotalCamposClinicosAutorizados\TotalCamposClinicosUsingSql:
        arguments:
            $connection: '@database_connection'

    App\Repository\IE\DetalleSolicitud\Expediente\Expediente:
        alias: App\Repository\IE\DetalleSolicitud\Expediente\ExpedienteUsingSql

    App\Repository\IE\DetalleSolicitud\Expediente\ExpedienteUsingSql:
        arguments:
            $connection: '@database_connection'

    App\Repository\IE\DetalleSolicitud\DetalleSolicitud:
        alias: App\Repository\IE\DetalleSolicitud\DetalleSolicitudUsingSql

    #DetalleSolicitudMultiple
    App\Repository\IE\DetalleSolicitudMultiple\DetalleSolicitudMultiple:
        alias: App\Repository\IE\DetalleSolicitudMultiple\DetalleSolicitudMultipleUsingSql

    App\Repository\IE\DetalleSolicitudMultiple\Expediente\Expediente:
        alias: App\Repository\IE\DetalleSolicitudMultiple\Expediente\ExpedienteUsingSql

    App\Repository\IE\DetalleSolicitudMultiple\Expediente\ExpedienteUsingSql:
        arguments:
            $connection: '@database_connection'

    App\Repository\IE\DetalleSolicitudMultiple\ListaCamposClinicos\CamposClinicos:
        alias: App\Repository\IE\DetalleSolicitudMultiple\ListaCamposClinicos\CamposClinicosUsingSql

    App\Repository\IE\DetalleSolicitudMultiple\ListaCamposClinicos\CamposClinicosUsingSql:
        arguments:
            $connection: '@database_connection'
